name: Release

# Builds the plugin for Mac (VST3, AU, Standalone; universal, Developer ID signed and notarized) and Windows (VST3,
# Standalone) with tools/dist/, and the Schwung module and HS2 MIDI Player for Ableton Move with schwung/build.sh and
# hs2-midi-player/build.sh. A tag v<version>
# (for example v0.3.2) publishes them all as a GitHub release; the tag must match VERSION in plugin/CMakeLists.txt.
# Run by hand (Actions, Release, Run workflow) it builds the packages as workflow artifacts without releasing anything.
#
# Repository secrets for the Mac build:
#   MAC_CERT_P12_B64    the "Developer ID Application" certificate with its private key, as a .p12, base64
#   MAC_CERT_PASSWORD   the .p12's password
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64   an App Store Connect API key (id, issuer, the .p8 base64) for
#                       notarization
# Without them a hand-run build is signed ad hoc and not notarized; a tag build stops instead.
# Windows builds are not code signed (no certificate).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version (and check it against the tag)
        id: v
        run: |
          VERSION="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\).*/\1/p' plugin/CMakeLists.txt | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION $VERSION in plugin/CMakeLists.txt (expected v$VERSION)."
            exit 1
          fi

  mac:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The Developer ID certificate in a keychain of its own, searched along with the runner's keychains.
      - name: Import the signing certificate
        env:
          MAC_CERT_P12_B64: ${{ secrets.MAC_CERT_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        if: env.MAC_CERT_P12_B64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[" ]//g')
          printf '%s' "$MAC_CERT_P12_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/devid.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        if: env.ASC_KEY_P8_B64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: A release needs signing and notarization
        if: github.ref_type == 'tag'
        env:
          HAVE_CERT: ${{ secrets.MAC_CERT_P12_B64 != '' }}
          HAVE_ASC: ${{ secrets.ASC_KEY_P8_B64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
        run: |
          if [ "$HAVE_CERT" != "true" ] || [ "$HAVE_ASC" != "true" ]; then
            echo "::error::Missing Mac signing / notarization secrets (see the top of .github/workflows/release.yml)."
            exit 1
          fi
          security find-identity -v -p codesigning | grep -q "Developer ID Application" ||
            { echo "::error::No Developer ID Application identity after the import."; exit 1; }

      # The build folder of the latest run (JUCE's download and juceaide, and the compiled code). The key leaves out
      # plugin/CMakeLists.txt so a version bump keeps the cache; JUCE's modules still compile again then, since JUCE
      # passes the version to them as a compiler define. A new JUCE version or patch starts clean.
      - name: Cache the build folder
        uses: actions/cache@v4
        with:
          path: build_dist_mac
          key: build-mac-${{ hashFiles('CMakeLists.txt', 'plugin/juce_patch/**', 'tools/dist/dist-mac.sh') }}-${{ github.run_id }}
          restore-keys: build-mac-${{ hashFiles('CMakeLists.txt', 'plugin/juce_patch/**', 'tools/dist/dist-mac.sh') }}-

      - name: Build, sign, notarize and zip
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Notarize only with a key (dist-mac.sh notarizes when ASC_KEY_ID and ASC_ISSUER_ID are set).
          [ -n "${ASC_KEY_PATH:-}" ] || unset ASC_KEY_ID ASC_ISSUER_ID
          tools/dist/dist-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HS2-Port-${{ needs.version.outputs.version }}-Mac
          path: dist/HS2-Port-${{ needs.version.outputs.version }}-Mac.zip
          if-no-files-found: error

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # As on Mac.
      - name: Cache the build folder
        uses: actions/cache@v4
        with:
          path: build_dist_win
          key: build-windows-${{ hashFiles('CMakeLists.txt', 'plugin/juce_patch/**', 'tools/dist/dist-windows.ps1') }}-${{ github.run_id }}
          restore-keys: build-windows-${{ hashFiles('CMakeLists.txt', 'plugin/juce_patch/**', 'tools/dist/dist-windows.ps1') }}-

      - name: Build and zip
        shell: pwsh
        run: tools\dist\dist-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: HS2-Port-${{ needs.version.outputs.version }}-Windows
          path: dist/HS2-Port-${{ needs.version.outputs.version }}-Windows.zip
          if-no-files-found: error

  # Windows 7, 8 and 8.1: the plugin against JUCE 7.0.12 (JUCE 9 needs Windows 10), C++ runtime linked in; the dist
  # script fails when the build imports anything newer than Windows 7.
  windows7:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache the build folder
        uses: actions/cache@v4
        with:
          path: build_dist_win7
          key: build-windows7-${{ hashFiles('CMakeLists.txt', 'plugin/juce_patch/**', 'tools/dist/dist-windows.ps1') }}-${{ github.run_id }}
          restore-keys: build-windows7-${{ hashFiles('CMakeLists.txt', 'plugin/juce_patch/**', 'tools/dist/dist-windows.ps1') }}-

      - name: Build, check and zip
        shell: pwsh
        run: tools\dist\dist-windows.ps1 -Windows7

      - uses: actions/upload-artifact@v4
        with:
          name: HS2-Port-${{ needs.version.outputs.version }}-Windows7
          path: dist/HS2-Port-${{ needs.version.outputs.version }}-Windows7.zip
          if-no-files-found: error

  # The Schwung module for Ableton Move (ARM64 Linux): the desktop host test, then schwung/build.sh, which
  # cross-compiles in Docker (schwung/Dockerfile) as it does locally without a cross compiler.
  schwung:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Host test
        run: schwung/tests/run_host_test.sh

      - name: Build the module
        run: schwung/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HS2-Port-${{ needs.version.outputs.version }}-Schwung
          path: dist/hypersonic2-module.tar.gz
          if-no-files-found: error

  # HS2 MIDI Player, a Schwung tool for Ableton Move: its desktop tests (the UI test is skipped without Schwung's
  # shared UI libraries), then hs2-midi-player/build.sh, which cross-compiles in the same Docker image.
  midi-player:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Desktop tests
        run: hs2-midi-player/tests/run_tests.sh

      - name: Build the module
        run: hs2-midi-player/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HS2-Port-${{ needs.version.outputs.version }}-MIDI-Player
          path: dist/hs2-midi-player-module.tar.gz
          if-no-files-found: error

  release:
    needs: [version, mac, windows, windows7, schwung, midi-player]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la artifacts
          cat > notes.md <<EOF
          HS2 Port $VERSION

          - **Mac:** HS2-Port-$VERSION-Mac.zip: VST3, AU and Standalone app (macOS 12 or later, Apple Silicon and Intel; signed and notarized).
          - **Windows 10 and 11:** HS2-Port-$VERSION-Windows.zip: VST3 and Standalone (64-bit).
          - **Windows 7, 8 and 8.1:** HS2-Port-$VERSION-Windows7.zip: the same plugin built for older Windows (64-bit).
          - **Ableton Move:** hypersonic2-module.tar.gz: the Schwung module (four parts, screen reader); see schwung/README.md in the source.
          - **Ableton Move:** hs2-midi-player-module.tar.gz: HS2 MIDI Player, a Schwung tool playing MIDI files on 16 parts; see hs2-midi-player/README.md in the source.

          Each zip has an Install.txt. The plugin needs your own Hypersonic 2 content folder.
          EOF
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/*.tar.gz --repo "$GITHUB_REPOSITORY" \
            --title "HS2 Port $VERSION" --notes-file notes.md --generate-notes
